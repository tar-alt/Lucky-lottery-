<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Game Demo System</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .card { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
    input, button, select { padding: 8px 12px; margin: 4px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; }
    button { cursor: pointer; background: #007bff; border: none; }
    button:hover { background: #0056b3; }
    .btn-red { background: #dc3545; }
    .btn-blue { background: #0d6efd; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
    .popup-content { background: #222; padding: 25px; border-radius: 8px; text-align: center; border: 2px solid #555; }
  </style>
</head>
<body>

  <h1>🎮 Realtime Game System</h1>

  <!-- Auth Panel -->
  <div id="authPanel" class="card">
    <h3>Register / Login</h3>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
  </div>

  <!-- User Dashboard -->
  <div id="userPanel" class="card hidden">
    <h3>Welcome, <span id="dispUser"></span></h3>
    <p>Player ID: <strong id="dispPlayerId" style="color: #00f2fe;"></strong></p>
    <p>Unit Balance: <strong id="dispBalance" style="color: #00ff88;">0</strong> Units</p>
    <button onclick="logout()" style="background: #6c757d;">Logout</button>

    <hr style="border-color: #333; margin: 15px 0;">

    <h4>Deposit / Withdraw Request</h4>
    <select id="txType">
      <option value="deposit">Deposit</option>
      <option value="withdraw">Withdraw</option>
    </select>
    <input type="number" id="txAmount" placeholder="Amount">
    <button onclick="requestTx()">Submit Request</button>

    <h4>Transaction History</h4>
    <table id="historyTable">
      <thead><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="card hidden" style="border-color: #ff9900;">
    <h3 style="color: #ff9900;">⚙️ Admin Control Panel</h3>
    
    <h4>Direct Unit Transfer</h4>
    <input type="text" id="admPlayerId" placeholder="Target Player ID">
    <input type="number" id="admAmount" placeholder="Amount (+/-)">
    <button onclick="directTransfer()">Update Balance</button>

    <h4>Pending Requests</h4>
    <table id="pendingTable">
      <thead><tr><th>User</th><th>Player ID</th><th>Type</th><th>Amount</th><th>Action</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Game Arena -->
  <div id="gamePanel" class="card hidden">
    <h2>🎯 Game Round: <span id="gameRound">-</span></h2>
    <h3 style="color: #ffcc00;">Timer: <span id="gameTimer">15</span>s</h3>

    <div>
      <input type="number" id="betAmount" placeholder="Bet Amount">
      <button class="btn-red" onclick="placeBet('RED')">Bet RED (x2)</button>
      <button class="btn-blue" onclick="placeBet('BLUE')">Bet BLUE (x2)</button>
    </div>
    <p id="betStatus" style="color: #aaa;"></p>
  </div>

  <!-- Popup Modal -->
  <div id="resultModal" class="popup hidden">
    <div class="popup-content">
      <h2 id="modalTitle"></h2>
      <p id="modalBody"></p>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;

    socket.on('timerUpdate', (data) => {
      document.getElementById('gameRound').innerText = data.round;
      document.getElementById('gameTimer').innerText = data.timer;
    });

    socket.on('betConfirmed', (data) => {
      document.getElementById('betStatus').innerText = `Placed ${data.amount} units on ${data.choice}`;
    });

    socket.on('errorMsg', (msg) => { alert(msg); });

    socket.on('roundResult', (data) => {
      const modal = document.getElementById('resultModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      if (data.win) {
        title.innerText = '🎉 YOU WIN!';
        title.style.color = '#00ff88';
        body.innerText = `Winning Choice: ${data.resultChoice}\nYou won +${data.amount} Units!`;
      } else {
        title.innerText = '❌ YOU LOST';
        title.style.color = '#dc3545';
        body.innerText = `Winning Choice: ${data.resultChoice}\nYou lost -${data.amount} Units.`;
      }
      modal.classList.remove('hidden');
      loadProfile();
    });

    socket.on('gameFinished', () => {
      document.getElementById('betStatus').innerText = '';
    });

    function closeModal() {
      document.getElementById('resultModal').classList.add('hidden');
    }

    async function register() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        loadProfile();
      } else {
        alert(data.error);
      }
    }

    async function loadProfile() {
      const res = await fetch('/api/me');
      if (!res.ok) return;

      currentUser = await res.json();
      document.getElementById('authPanel').classList.add('hidden');
      document.getElementById('userPanel').classList.remove('hidden');
      document.getElementById('gamePanel').classList.remove('hidden');

      document.getElementById('dispUser').innerText = currentUser.username;
      document.getElementById('dispPlayerId').innerText = currentUser.player_id;
      document.getElementById('dispBalance').innerText = currentUser.balance;

      if (currentUser.role === 'admin') {
        document.getElementById('adminPanel').classList.remove('hidden');
        loadPendingTxs();
      }

      loadHistory();
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    }

    async function requestTx() {
      const type = document.getElementById('txType').value;
      const amount = document.getElementById('txAmount').value;
      const res = await fetch('/api/request-transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, amount })
      });
      const data = await res.json();
      alert(data.message || data.error);
      loadHistory();
    }

    async function loadHistory() {
      const res = await fetch('/api/my-history');
      const rows = await res.json();
      const tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.type}</td>
          <td>${r.amount}</td>
          <td>${r.status}</td>
          <td>${new Date(r.created_at).toLocaleString()}</td>
        </tr>
      `).join('');
    }

    async function loadPendingTxs() {
      const res = await fetch('/api/admin/pending-transactions');
      const rows = await res.json();
      const tbody = document.querySelector('#pendingTable tbody');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.username}</td>
          <td>${r.player_id}</td>
          <td>${r.type}</td>
          <td>${r.amount}</td>
          <td><button onclick="approveTx(${r.id})">Approve</button></td>
        </tr>
      `).join('');
    }

    async function approveTx(txId) {
      const res = await fetch('/api/admin/approve-transaction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId })
      });
      const data = await res.json();
      alert(data.message || data.error);
      loadPendingTxs();
    }

    async function directTransfer() {
      const playerId = document.getElementById('admPlayerId').value;
      const amount = document.getElementById('admAmount').value;
      const res = await fetch('/api/admin/direct-transfer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playerId, amount })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    function placeBet(choice) {
      const amount = document.getElementById('betAmount').value;
      socket.emit('placeBet', { choice, amount });
    }

    // Auto load session on refresh
    loadProfile();
  </script>
</body>
</html>
